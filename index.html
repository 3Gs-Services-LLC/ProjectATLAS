<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project ATLAS</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        background: #000000;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 2.5rem;
        font-family: Arial, Helvetica, sans-serif;
    }

    .logo {
        max-width: 60%;
        height: auto;
    }

    .coming-soon {
        font-size: 4rem;
        font-weight: bold;
        letter-spacing: 0.15em;
        text-align: center;
        background: linear-gradient(90deg, #4facfe, #ffffff, #4facfe);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        text-shadow: 0 0 10px rgba(79, 172, 254, 0.6);
        filter: drop-shadow(0 0 20px rgba(79, 172, 254, 0.8));
        animation: shine 3s linear infinite;
    }

    @keyframes shine {
        to {
            background-position: 200% center;
        }
    }
</style>
</head>
<body>
    <img class="logo" src="ProjectATLAS Main Logo.png" alt="Project ATLAS Logo">
    <div class="coming-soon">COMING SOON!</div>
</body>
</html>
